{% extends "home/base.html" %}

{% block content %}

<section class="overflow-hidden bg-[#f8f6f1] py-10 lg:py-12">

    <div class="mx-auto max-w-[1440px] px-5 sm:px-8 lg:px-12">

        <!-- Header -->
        <div class="mb-6 flex flex-col justify-between gap-3 md:flex-row md:items-end">

            <div>
                <div class="mb-2 flex items-center gap-3">
                    <span class="h-px w-6 bg-[#b89252]"></span>
                    <span class="text-[8px] font-semibold uppercase tracking-[0.32em] text-[#b89252]">
                        Trusted Developers
                    </span>
                </div>

                <h2 class="font-serif text-2xl leading-tight tracking-[-0.02em] text-[#172033] sm:text-3xl lg:text-[2.8rem]">
                    Leading names.
                    <span class="italic text-[#b89252]">Exceptional projects.</span>
                </h2>
            </div>

            <a href="#"
               class="group flex w-fit items-center gap-3 text-[8px] font-semibold uppercase tracking-[0.2em] text-[#172033] hover:text-[#b89252]">
                View All Developers
                <i class="fa-solid fa-arrow-right text-[8px] transition-transform duration-300 group-hover:translate-x-1"></i>
            </a>

        </div>


        <!-- Developer Grid -->
        <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">


            
            <article class="developer-card group relative rounded-xl border border-[#dfdbd3] bg-white p-4 transition-all duration-300 hover:-translate-y-1 hover:border-[#b89252]/40 hover:shadow-lg">

                <div class="flex items-center justify-between">
                    <span class="text-[7px] font-semibold uppercase tracking-[0.2em] text-[#aaa59c]">
                        Developer
                    </span>
                    <span class="font-serif text-2xl leading-none text-[#172033]/[0.06]">01</span>
                </div>
                <div class="mt-3 h-[100px] overflow-hidden rounded-lg border border-[#eeeae4]">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBn9X13kIbkG1BZJWooQNqheOSBKWfOpJ_W_-ii9ME4A&s=10" alt="Lodha" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105">
                </div>

                <h3 class="mt-4 font-serif text-xl leading-none text-[#172033]">
                    Lodha
                </h3>

                <div class="mt-4 flex items-center justify-between border-y border-[#ebe7e0] py-2.5">
                    <div>
                        <span class="block text-[7px] uppercase tracking-[0.18em] text-[#aaa59c]">
                            Projects
                        </span>
                        <span class="font-serif text-xl text-[#172033]">42</span>
                    </div>
                    <i class="fa-solid fa-building text-[10px] text-[#b89252]"></i>
                </div>

                <a href="#"
                   class="mt-3 flex items-center justify-between text-[8px] font-bold uppercase tracking-[0.18em] text-[#172033] transition-colors hover:text-[#b89252]">
                    See All Projects
                    <i class="fa-solid fa-arrow-right text-[8px]"></i>
                </a>

            </article>

        </div>

    </div>
</section>


{% endblock content %}
