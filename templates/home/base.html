{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Your website description here{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}website, business, services{% endblock %}">
    <meta name="author" content="{% block meta_author %}Your Company{% endblock %}">
    <title>{% block title %}Website{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>


<body class="bg-white text-gray-800 font-sans antialiased">

    {% include "home/header.html" %}

{% block content %}



{% endblock %}

    {% include "home/footer.html" %}


</body>
</html>
