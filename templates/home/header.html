{% load static %}

<header class="luxury-header" id="luxuryHeader">

    <div class="luxury-container">

        <!-- Logo -->
        <a href="/" class="luxury-logo">
            <img src="{{settings_obj.logo.url}}" alt="Logo">
        </a>

        <!-- Desktop Navigation -->
        <nav class="luxury-nav">

            <a href="/"  class="luxury-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                Home
            </a>

            <a href="{% url 'about' %}"  class="luxury-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">
                About Us
            </a>

            <a href="{% url 'search_projects' %}"  class="luxury-link {% if request.resolver_match.url_name == 'search_projects' %}active{% endif %}">
                Properties
            </a>

            <a href="{% url 'localities' %}"  class="luxury-link {% if request.resolver_match.url_name == 'localities' %}active{% endif %}">
                Localities
            </a>

            <a href="{% url 'developers' %}"  class="luxury-link {% if request.resolver_match.url_name == 'developers' %}active{% endif %}">
                Developers
            </a>

            <a href="{% url 'services' %}"  class="luxury-link {% if request.resolver_match.url_name == 'services' %}active{% endif %}">
                Services
            </a>

            <a href="{% url 'calculator' %}"  class="luxury-link {% if request.resolver_match.url_name == 'calculator' %}active{% endif %}">
                Calculator
            </a>

        </nav>

        <!-- Right -->
        <div class="luxury-right">

            <a href="tel:+91{{settings_obj.phone }}" class="luxury-phone">
                <span class="phone-icon">
                    <i class="fa-solid fa-phone"></i>
                </span>

                <span>
                    <small>Call Us</small>
                    +91 {{settings_obj.phone }}
                </span>
            </a>

            <a href="{% url "contact" %}" class="luxury-contact">
                Contact Us
                <i class="fa-solid fa-arrow-right"></i>
            </a>

        </div>

        <!-- Mobile Toggle -->
        <button class="luxury-toggle" id="luxuryToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>


    <!-- Mobile Navigation -->
    <div class="luxury-mobile" id="luxuryMobile">

        <div class="luxury-mobile-inner">

            <a href="/" class="luxury-mobile-link active">
                <span>01</span>
                Home
            </a>

            <a href="{% url "about" %}" class="luxury-mobile-link">
                <span>02</span>
                About Us
            </a>

            <a href="{% url "search_projects" %}" class="luxury-mobile-link">
                <span>03</span>
                Properties
            </a>

            <a href="{% url "localities" %}" class="luxury-mobile-link">
                <span>04</span>
                Localities
            </a>

            <a href="{% url "developers" %}" class="luxury-mobile-link">
                <span>05</span>
                Developers
            </a>

            <a href="{% url "services" %}" class="luxury-mobile-link">
                <span>06</span>
                Services
            </a>

            <a href="{% url "calculator" %}" class="luxury-mobile-link">
                <span>07</span>
                Calculator
            </a>

            <div class="luxury-mobile-footer">

                <a href="tel:+91{{settings_obj.phone }}">
                    <i class="fa-solid fa-phone"></i>
                    +91 {{settings_obj.phone }}
                </a>

                <a href="{% url "contact" %}" class="luxury-mobile-contact">
                    Contact Us
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

            </div>

        </div>

    </div>

</header>


<style>

    .luxury-header {
        width: 100%;
        background: #ffffff;
        position: relative;
        z-index: 9999;
        border-bottom: 1px solid #eeeeee;
    }

    .luxury-container {
        max-width: 1440px;
        height: 86px;
        margin: auto;
        padding: 0 35px;

        display: flex;
        align-items: center;
    }


    .luxury-logo {
        width: 180px;
        flex-shrink: 0;
    }

    .luxury-logo img {
        width: 155px;
        max-height: 60px;
        object-fit: contain;
        display: block;
    }



    .luxury-nav {
        flex: 1;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 30px;
    }

    .luxury-link {
        position: relative;

        color: #242424;
        text-decoration: none;

        font-size: 13px;
        font-weight: 500;

        padding: 34px 0;

        transition: 0.3s ease;
    }

    .luxury-link:hover,
    .luxury-link.active {
        color: #a77b35;
    }

    .luxury-link::after {
        content: "";

        position: absolute;

        left: 50%;
        bottom: 25px;

        width: 0;
        height: 1px;

        background: #a77b35;

        transform: translateX(-50%);

        transition: 0.3s ease;
    }

    .luxury-link.active::after {
        width: 24px;
        height: 2px;
    }

    .luxury-link:hover::after {
        width: 20px;
        height: 1px;
    }

    .luxury-right {
        display: flex;
        align-items: center;
        gap: 25px;

        flex-shrink: 0;
    }


    .luxury-phone {
        display: flex;
        align-items: center;
        gap: 10px;

        color: #222;
        text-decoration: none;

        font-size: 13px;
        line-height: 1.3;
    }

    .luxury-phone small {
        display: block;

        color: #999;

        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;

        margin-bottom: 2px;
    }

    .phone-icon {
        width: 34px;
        height: 34px;

        border: 1px solid #dfcfb1;
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #a77b35;
        font-size: 11px;
    }



    .luxury-contact {
        height: 43px;

        padding: 0 18px;

        display: flex;
        align-items: center;
        gap: 12px;

        background: #1e1e1e;
        color: #fff;

        text-decoration: none;

        font-size: 12px;
        font-weight: 500;

        transition: 0.3s ease;
    }

    .luxury-contact i {
        font-size: 10px;
        transition: 0.3s ease;
    }

    .luxury-contact:hover {
        background: #a77b35;
        color: #fff;
    }

    .luxury-contact:hover i {
        transform: translateX(4px);
    }


    .luxury-toggle {
        display: none;

        width: 42px;
        height: 42px;

        border: 0;
        background: transparent;

        padding: 7px;

        cursor: pointer;
    }

    .luxury-toggle span {
        display: block;

        width: 25px;
        height: 1.5px;

        background: #222;

        margin: 5px auto;

        transition: 0.3s ease;
    }

    .luxury-toggle.active span:nth-child(1) {
        transform: translateY(6.5px) rotate(45deg);
    }

    .luxury-toggle.active span:nth-child(2) {
        opacity: 0;
    }

    .luxury-toggle.active span:nth-child(3) {
        transform: translateY(-6.5px) rotate(-45deg);
    }


    .luxury-mobile {
        display: none;

        background: #1d1d1d;

        border-top: 1px solid #333;
    }

    .luxury-mobile.show {
        display: block;
    }

    .luxury-mobile-inner {
        padding: 15px 25px 25px;
    }

    .luxury-mobile-link {
        display: flex;
        align-items: center;

        gap: 18px;

        padding: 16px 0;

        color: #fff;
        text-decoration: none;

        font-size: 16px;
        font-weight: 400;

        border-bottom: 1px solid #333;

        transition: 0.3s ease;
    }

    .luxury-mobile-link span {
        width: 25px;

        color: #a77b35;

        font-size: 10px;
        letter-spacing: 1px;
    }

    .luxury-mobile-link:hover {
        color: #c89b55;
        padding-left: 8px;
    }



    .luxury-mobile-footer {
        padding-top: 25px;

        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .luxury-mobile-footer > a:not(.luxury-mobile-contact) {
        color: #ddd;

        text-decoration: none;

        font-size: 13px;
    }

    .luxury-mobile-footer i {
        color: #a77b35;
        margin-right: 8px;
    }

    .luxury-mobile-contact {
        height: 48px;

        background: #a77b35;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 12px;

        color: #fff;

        text-decoration: none;

        font-size: 13px;
    }


    @media (max-width: 1200px) {

        .luxury-nav {
            gap: 20px;
        }

        .luxury-link {
            font-size: 12px;
        }

        .luxury-phone {
            display: none;
        }

    }


    @media (max-width: 991px) {

        .luxury-container {
            height: 72px;
            padding: 0 20px;
        }

        .luxury-logo {
            width: auto;
        }

        .luxury-logo img {
            width: 140px;
        }

        .luxury-nav,
        .luxury-right {
            display: none;
        }

        .luxury-toggle {
            display: block;
            margin-left: auto;
        }

    }


    @media (max-width: 480px) {

        .luxury-container {
            height: 65px;
            padding: 0 15px;
        }

        .luxury-logo img {
            width: 125px;
        }

    }

</style>


<script>

    document.addEventListener("DOMContentLoaded", function () {

        const toggle = document.getElementById("luxuryToggle");
        const menu = document.getElementById("luxuryMobile");

        toggle.addEventListener("click", function () {

            toggle.classList.toggle("active");
            menu.classList.toggle("show");

        });

        document.querySelectorAll(".luxury-mobile-link, .luxury-mobile-contact")
            .forEach(function(link) {

                link.addEventListener("click", function() {

                    toggle.classList.remove("active");
                    menu.classList.remove("show");

                });

            });

    });

</script>
