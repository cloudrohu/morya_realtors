
<header class="sticky top-0 z-50 bg-[#faf9f6]/95 backdrop-blur-md">

    <!-- Luxury Top Line -->
    <div class="h-[2px] bg-[#b08d57]"></div>

    <div class="max-w-7xl mx-auto px-5 sm:px-8 lg:px-10">

        <div class="h-[82px] flex items-center justify-between">

            <a href="/" class="group flex items-center gap-3">

                <div class="w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center shrink-0">
                    <img src="{{settings_obj.logo.url}}" alt="{{settings_obj.site_name}}" class="w-full h-full object-contain">
                </div>

            </a>

            <nav class="hidden lg:flex items-center gap-9">

                <a href="/" class="relative text-[13px] font-medium text-[#b08d57] group">

                    Home

                    <span class="absolute -bottom-2 left-0 w-full h-px bg-[#b08d57]"></span>

                </a>

                <a href="{% url "about" %}" class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    About Us
                </a>

                <a href="{% url "search_projects" %}"     class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    Properties
                </a>

                <a href="{% url "localities" %}" class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    Localities
                </a>

                <a href="{% url "developers" %}" class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    Developers
                </a>

                <a href="{% url "services" %}" class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    Services
                </a>

                <a href="{% url "calculator" %}" class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    Calculator
                </a>

                <a href="{% url "blog:blog_list" %}" class="text-[13px] font-medium text-[#444] hover:text-[#b08d57] transition-colors duration-300">
                    Blog
                </a>

            </nav>


            <div class="hidden lg:flex items-center gap-7">

                <!-- Phone -->
                <a href="tel:+91{{settings_obj.phone}}" class="text-[12px] font-medium text-[#333] hover:text-[#b08d57] transition-colors">

                    +91 {{settings_obj.phone}}

                </a>


                <!-- Divider -->
                <div class="h-5 w-px bg-[#d8d4cc]"></div>


                <!-- Contact -->
                <a href="{% url "contact" %}" class="group flex items-center gap-3 bg-[#171717] text-white px-5 py-3 text-[12px] font-medium tracking-wide hover:bg-[#b08d57] transition-all duration-300">

                    <span>Contact Us</span>

                    <i class="fa-solid fa-arrow-right text-[10px] transition-transform duration-300 group-hover:translate-x-1"></i>

                </a>

            </div>

            <button id="mobileMenuBtn" class="lg:hidden w-10 h-10 flex items-center justify-center text-[#171717]">

                <i class="fa-solid fa-bars text-lg"></i>

            </button>

        </div>

        <div id="mobileMenu" class="hidden lg:hidden border-t border-[#e5e1da] py-5">

            <nav class="flex flex-col">

                <a href="/" class="py-3 text-sm text-[#b08d57] font-medium border-b border-[#eeeae3]">
                    Home
                </a>

                <a href="{% url "search_projects" %}" class="py-3 text-sm text-[#333] hover:text-[#b08d57] border-b border-[#eeeae3]">
                    Properties
                </a>

                <a href="{% url "localities" %}" class="py-3 text-sm text-[#333] hover:text-[#b08d57] border-b border-[#eeeae3]">
                    Localities
                </a>

                <a href="{% url "developers" %}" class="py-3 text-sm text-[#333] hover:text-[#b08d57] border-b border-[#eeeae3]">
                    Developers
                </a>

                <a href="{% url "services" %}" class="py-3 text-sm text-[#333] hover:text-[#b08d57] border-b border-[#eeeae3]">
                    Services
                </a>

                <a href="{% url "calculator" %}" class="py-3 text-sm text-[#333] hover:text-[#b08d57] border-b border-[#eeeae3]">
                    Calculator
                </a>

                <a href="{% url "blog:blog_list" %}" class="py-3 text-sm text-[#333] hover:text-[#b08d57]">
                    Blog
                </a>


                <!-- Mobile CTA -->
                <a href="{% url "contact" %}" class="mt-5 flex items-center justify-center gap-3 py-3.5 bg-[#171717] text-white text-sm font-medium">

                    Contact Us

                    <i class="fa-solid fa-arrow-right text-xs"></i>

                </a>

            </nav>

        </div>

    </div>

</header>



<script>

    const menuBtn = document.getElementById("mobileMenuBtn");
    const mobileMenu = document.getElementById("mobileMenu");

    menuBtn.addEventListener("click", () => {

        mobileMenu.classList.toggle("hidden");

        const icon = menuBtn.querySelector("i");

        if (mobileMenu.classList.contains("hidden")) {

            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");

        } else {

            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");

        }

    });

</script>
