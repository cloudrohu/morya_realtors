{% extends "home/base.html" %}

{% block content %}

<!-- FAQ HERO -->
<section class="relative overflow-hidden bg-[#faf9f6] pt-28 pb-16 sm:pt-32 sm:pb-20 lg:pt-36 lg:pb-24">

    <!-- Decorative Background -->
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-[#d9b98c]/10 blur-3xl"></div>
    <div class="absolute -bottom-24 -left-24 w-72 h-72 rounded-full bg-[#d9b98c]/10 blur-3xl"></div>

    <div class="relative max-w-7xl mx-auto px-5 sm:px-6 lg:px-8">

        <div class="max-w-3xl mx-auto text-center">

            <!-- Label -->
            <div class="inline-flex items-center gap-2 mb-5">
                <span class="w-7 h-px bg-[#b28a55]"></span>

                <span class="text-[11px] sm:text-xs font-semibold tracking-[0.22em] uppercase text-[#9a7445]">
                    Frequently Asked Questions
                </span>

                <span class="w-7 h-px bg-[#b28a55]"></span>
            </div>

            <!-- Heading -->
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-semibold tracking-tight text-neutral-900 leading-[1.08]">
                Everything You Need
                <span class="block text-[#a47b48]">
                    To Know
                </span>
            </h1>

            <!-- Description -->
            <p class="mt-6 max-w-2xl mx-auto text-sm sm:text-base lg:text-lg leading-7 text-neutral-600">
                Find answers to the most common questions about
                Vinayak Sapphire II, from project details and amenities
                to location, pricing and booking.
            </p>

        </div>

    </div>
</section>




{% endblock content %}
