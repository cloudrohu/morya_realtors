{% extends "home/base.html" %}

{% block content %}

<style>
    .privacy-page {
        background: #faf9f6;
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Hero */
    .privacy-hero {
        position: relative;
        overflow: hidden;
        padding: 90px 20px 70px;
        background:
            linear-gradient(135deg, rgba(200, 155, 44, 0.10), rgba(255,255,255,0.96)),
            #ffffff;
        border-bottom: 1px solid #eee8dc;
    }

    .privacy-hero::before {
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: rgba(200, 155, 44, 0.08);
        top: -120px;
        right: -80px;
    }

    .privacy-hero-inner {
        position: relative;
        z-index: 1;
        max-width: 1100px;
        margin: 0 auto;
        text-align: center;
    }

    .privacy-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        margin-bottom: 18px;
        border: 1px solid #eadfca;
        border-radius: 999px;
        background: #fffaf0;
        color: #9a7315;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .5px;
        text-transform: uppercase;
    }

    .privacy-badge i {
        font-size: 12px;
    }

    .privacy-hero h1 {
        margin: 0;
        color: #172033;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: -1.2px;
    }

    .privacy-hero p {
        max-width: 700px;
        margin: 18px auto 0;
        color: #667085;
        font-size: 15px;
        line-height: 1.8;
    }

    .privacy-updated {
        margin-top: 22px;
        color: #8a93a3;
        font-size: 13px;
    }

    .privacy-updated strong {
        color: #475467;
    }

    /* Main */
    .privacy-main {
        padding: 55px 20px 80px;
    }

    .privacy-container {
        max-width: 1050px;
        margin: 0 auto;
    }

    .privacy-card {
        background: #ffffff;
        border: 1px solid #e9e5dc;
        border-radius: 20px;
        padding: 35px 42px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.055);
    }

    /* Content */
    .terms_condition {
        color: #475569;
        font-size: 15px;
        line-height: 1.9;
        overflow-wrap: anywhere;
        word-break: normal;
    }

    .terms_condition h1 {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 800;
        color: #172033;
        line-height: 1.25;
        margin: 10px 0 20px;
        letter-spacing: -0.8px;
    }

    .terms_condition h2 {
        font-size: clamp(21px, 3vw, 28px);
        font-weight: 750;
        color: #172033;
        line-height: 1.35;
        margin: 42px 0 17px;
        padding: 5px 0 5px 17px;
        border-left: 4px solid #c89b2c;
    }

    .terms_condition h3 {
        font-size: 19px;
        font-weight: 700;
        color: #273449;
        margin: 30px 0 12px;
        line-height: 1.5;
    }

    .terms_condition h4,
    .terms_condition h5,
    .terms_condition h6 {
        color: #273449;
        font-weight: 700;
        margin: 24px 0 10px;
    }

    .terms_condition p {
        margin: 0 0 18px;
        color: #596579;
    }

    .terms_condition strong,
    .terms_condition b {
        color: #263348;
        font-weight: 700;
    }

    /* Lists */
    .terms_condition ul,
    .terms_condition ol {
        margin: 18px 0 25px;
        padding-left: 28px;
        color: #596579;
    }

    .terms_condition ul {
        list-style-type: disc;
    }

    .terms_condition ol {
        list-style-type: decimal;
    }

    .terms_condition li {
        padding-left: 5px;
        margin-bottom: 10px;
    }

    .terms_condition li::marker {
        color: #c89b2c;
        font-weight: 700;
    }

    .terms_condition li > p {
        margin-bottom: 8px;
    }

    /* Links */
    .terms_condition a {
        color: #a77b13;
        text-decoration: underline;
        text-underline-offset: 4px;
        overflow-wrap: anywhere;
        transition: color .2s ease;
    }

    .terms_condition a:hover {
        color: #78570b;
    }

    /* Images */
    .terms_condition img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 14px;
        margin: 24px auto;
        box-shadow: 0 8px 28px rgba(15, 23, 42, .09);
    }

    /* Tables */
    .terms_condition table {
        width: 100%;
        max-width: 100%;
        border-collapse: collapse;
        margin: 24px 0;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .terms_condition th {
        background: #f5f1e7;
        color: #273449;
        font-weight: 700;
        text-align: left;
    }

    .terms_condition th,
    .terms_condition td {
        border: 1px solid #e5e7eb;
        padding: 12px 15px;
        vertical-align: top;
    }

    .terms_condition tr:nth-child(even) td {
        background: #fafaf9;
    }

    /* Blockquote */
    .terms_condition blockquote {
        margin: 28px 0;
        padding: 22px 24px;
        border-left: 4px solid #c89b2c;
        border-radius: 0 12px 12px 0;
        background: #faf7ef;
        color: #475569;
        font-size: 15px;
        font-style: italic;
    }

    .terms_condition blockquote p:last-child {
        margin-bottom: 0;
    }

    /* HR */
    .terms_condition hr {
        border: 0;
        border-top: 1px solid #e5e7eb;
        margin: 34px 0;
    }

    /* Alignment */
    .terms_condition .text-align-center,
    .terms_condition [style*="text-align: center"] {
        text-align: center;
    }

    .terms_condition [style*="text-align: right"] {
        text-align: right;
    }

    .terms_condition [style*="text-align: justify"] {
        text-align: justify;
    }

    /* Contact highlight */
    .terms_condition .contact-box {
        padding: 22px 24px;
        margin-top: 25px;
        border: 1px solid #eadfca;
        border-radius: 14px;
        background: #fffaf0;
    }

    /* Mobile */
    @media (max-width: 768px) {

        .privacy-hero {
            padding: 70px 18px 55px;
        }

        .privacy-main {
            padding: 35px 15px 60px;
        }

        .privacy-card {
            padding: 25px 20px;
            border-radius: 16px;
        }

        .terms_condition {
            font-size: 14px;
            line-height: 1.8;
        }

        .terms_condition h1 {
            margin-top: 5px;
        }

        .terms_condition h2 {
            margin-top: 32px;
            padding-left: 12px;
        }

        .terms_condition h3 {
            font-size: 18px;
        }

        .terms_condition table {
            display: block;
            overflow-x: auto;
            white-space: normal;
        }

        .terms_condition th,
        .terms_condition td {
            padding: 10px;
            min-width: 110px;
        }
    }

    @media (max-width: 480px) {

        .privacy-hero {
            padding: 55px 15px 45px;
        }

        .privacy-hero h1 {
            font-size: 31px;
        }

        .privacy-hero p {
            font-size: 14px;
        }

        .privacy-card {
            padding: 22px 17px;
        }

        .terms_condition h2 {
            font-size: 21px;
        }

        .terms_condition ul,
        .terms_condition ol {
            padding-left: 23px;
        }
    }
</style>


<div class="privacy-page">

    <!-- Hero -->
    <section class="privacy-hero">
        <div class="privacy-hero-inner">

            <div class="privacy-badge">
                <i class="fa-solid fa-shield-halved"></i>
                Your Terms of Service Matters
            </div>

            <h1>Terms of Service</h1>

            <p>
                At {{settings_obj.site_name}}, we respect your privacy and are committed
                to protecting the information you share with us.
            </p>

        </div>
    </section>


    <!-- Content -->
    <section class="privacy-main">

        <div class="privacy-container">

            <div class="privacy-card">

                <div class="terms_condition">

                    {{ settings_obj.terms_conditions|safe }}

                </div>

            </div>

        </div>

    </section>

</div>

{% endblock content %}
